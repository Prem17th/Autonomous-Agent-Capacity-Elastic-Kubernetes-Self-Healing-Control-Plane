[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis-sentinel"
version = "0.1.0"
description = "AI-powered elastic Kubernetes capacity and recovery system for Aegis agent creation"
readme = "README.md"
authors = [
    { name = "Aegis Sentinel Team" }
]
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
aegis-sentinel = "src.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

