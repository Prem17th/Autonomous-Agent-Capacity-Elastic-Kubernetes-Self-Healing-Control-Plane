[package]
name = "sentinel-core"
version = "0.1.0"
edition = "2021"
authors = ["Nasiko Sentinel Core Team"]
description = "High-Performance Rust Core Engine & Safety Policy Gate for Nasiko Sentinel"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }

[[bin]]
name = "sentinel-cli"
path = "src/main.rs"
